<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
    </filter>
    <filter id="drop-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818CF8" flood-opacity="0.4"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.5px; }
    .sub { font-weight: 600; letter-spacing: 2px; }
    .tag { font-size: 13px; font-weight: 600; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)"/>

  <!-- Glowing Ambiance Orbs -->
  <circle cx="150" cy="80" r="140" fill="#0EA5E9" fill-opacity="0.12" filter="url(#glow-cyan)"/>
  <circle cx="1050" cy="120" r="180" fill="#8B5CF6" fill-opacity="0.15" filter="url(#glow-purple)"/>
  <circle cx="600" cy="340" r="160" fill="#EC4899" fill-opacity="0.08" filter="url(#glow-purple)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#cyber-grid)"/>

  <!-- Outer Border with Gradient -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#border-gradient)" stroke-width="1.5"/>

  <!-- Cyber Tech Circuit Nodes (Right Side Art) -->
  <g opacity="0.65">
    <path d="M880 70 L980 70 L1040 130 L1130 130" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <path d="M920 180 L1000 180 L1050 230 L1140 230" stroke="#818CF8" stroke-width="1.5" fill="none"/>
    <path d="M960 290 L1040 290 L1080 250 L1150 250" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="6 3" fill="none"/>
    
    <!-- Connection Dots -->
    <circle cx="880" cy="70" r="4" fill="#38BDF8"/>
    <circle cx="980" cy="70" r="3" fill="#818CF8"/>
    <circle cx="1040" cy="130" r="5" fill="#38BDF8" filter="url(#drop-glow)"/>
    <circle cx="1130" cy="130" r="4" fill="#A855F7"/>
    <circle cx="920" cy="180" r="3" fill="#818CF8"/>
    <circle cx="1000" cy="180" r="4" fill="#A855F7"/>
    <circle cx="1050" cy="230" r="5" fill="#EC4899" filter="url(#drop-glow)"/>
    <circle cx="1140" cy="230" r="3.5" fill="#38BDF8"/>
    <circle cx="960" cy="290" r="4" fill="#F43F5E"/>
    <circle cx="1080" cy="250" r="3" fill="#A855F7"/>
    <circle cx="1150" cy="250" r="4" fill="#38BDF8"/>
  </g>

  <!-- Corner Brackets -->
  <g opacity="0.8">
    <path d="M 35 50 L 35 35 L 50 35" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
    <path d="M 1165 50 L 1165 35 L 1150 35" stroke="#EC4899" stroke-width="2.5" fill="none"/>
    <path d="M 35 310 L 35 325 L 50 325" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
    <path d="M 1165 310 L 1165 325 L 1150 325" stroke="#EC4899" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Top Pill: Status / Award Badge -->
  <g transform="translate(60, 48)">
    <rect width="440" height="30" rx="15" fill="#1E1B4B" fill-opacity="0.8" stroke="#6366F1" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#F59E0B"/>
    <text x="28" y="19.5" fill="#E0E7FF" class="font-mono tag" font-size="11.5">🏆 1ST PLACE WINNER • VIRTUSA AGENTIC AI HACKATHON</text>
  </g>

  <!-- Available for Work Pill -->
  <g transform="translate(515, 48)">
    <rect width="210" height="30" rx="15" fill="#064E3B" fill-opacity="0.7" stroke="#10B981" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#34D399"/>
    <text x="28" y="19.5" fill="#D1FAE5" class="font-mono tag" font-size="11.5">OPEN FOR COLLAB &amp; ROLES</text>
  </g>

  <!-- Main Name Heading -->
  <text x="60" y="145" fill="url(#text-gradient)" class="font-sans title" font-size="44" filter="url(#drop-glow)">
    LASITHA DILSHAN THILAKARATHNA
  </text>

  <!-- Subtitle / Role -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" fill="#F8FAFC" class="font-sans sub" font-size="18">
      AI ENGINEER &amp; GENERATIVE AI ARCHITECT
    </text>
    <text x="440" y="0" fill="#64748B" class="font-mono" font-size="18">|</text>
    <text x="460" y="0" fill="#94A3B8" class="font-sans" font-size="16" font-weight="500">
      5+ Years Full-Stack &amp; Cloud Engineering
    </text>
  </g>

  <!-- Value Proposition Description -->
  <text x="60" y="226" fill="#94A3B8" class="font-sans" font-size="15" font-weight="400">
    Architecting production-ready Autonomous AI Agents, Enterprise RAG systems, and resilient cloud backends.
  </text>
  <text x="60" y="248" fill="#64748B" class="font-sans" font-size="14" font-weight="400">
    Bridging frontier LLMs with high-throughput microservices, vector intelligence, and human-in-the-loop workflows.
  </text>

  <!-- Core Pillar Badges (Bottom Row) -->
  <g transform="translate(60, 285)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="3" fill="#38BDF8"/>
      <text x="28" y="22" fill="#E2E8F0" class="font-mono tag">Agentic AI &amp; ADK</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(182, 0)">
      <rect width="160" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="3" fill="#818CF8"/>
      <text x="28" y="22" fill="#E2E8F0" class="font-mono tag">Enterprise RAG</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(354, 0)">
      <rect width="180" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="3" fill="#A855F7"/>
      <text x="28" y="22" fill="#E2E8F0" class="font-mono tag">LLM Orchestration</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(546, 0)">
      <rect width="170" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="3" fill="#EC4899"/>
      <text x="28" y="22" fill="#E2E8F0" class="font-mono tag">FastAPI &amp; Python</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(728, 0)">
      <rect width="190" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="17" r="3" fill="#10B981"/>
      <text x="28" y="22" fill="#E2E8F0" class="font-mono tag">Vector DBs &amp; Cloud</text>
    </g>
  </g>
</svg>

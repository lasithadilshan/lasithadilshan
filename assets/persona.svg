<svg fill="none" viewBox="0 0 1000 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="term-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="cursor-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <style>
    .font-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    .kw { fill: #C084FC; font-weight: 600; }
    .cls { fill: #38BDF8; font-weight: 700; }
    .func { fill: #60A5FA; font-weight: 600; }
    .str { fill: #34D399; }
    .num { fill: #F59E0B; font-weight: 600; }
    .var { fill: #E2E8F0; }
    .self { fill: #F472B6; font-weight: 600; }
    .doc { fill: #64748B; font-style: italic; }
    .op { fill: #94A3B8; }
    .line-no { fill: #334155; font-size: 12.5px; text-anchor: end; user-select: none; }
  </style>

  <!-- Window Container -->
  <rect x="2" y="2" width="996" height="476" rx="14" fill="url(#term-bg)" filter="url(#term-glow)"/>
  <rect x="2" y="2" width="996" height="476" rx="14" fill="none" stroke="url(#term-border)" stroke-width="1.5"/>

  <!-- Top Window Header Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 984 2 Q 998 2 998 16 L 998 42 L 2 42 Z" fill="#0E1526"/>
  <line x1="2" y1="42" x2="998" y2="42" stroke="#1E293B" stroke-width="1"/>

  <!-- macOS Window Control Dots -->
  <circle cx="24" cy="22" r="6" fill="#EF4444"/>
  <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="6" fill="#10B981"/>

  <!-- Tab Pill -->
  <g transform="translate(90, 8)">
    <rect width="180" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <!-- Python icon mini dot -->
    <circle cx="16" cy="14" r="4" fill="#38BDF8"/>
    <text x="28" y="18.5" fill="#E2E8F0" class="font-ui" font-weight="600">persona_spec.py</text>
  </g>

  <!-- Right Header Info / Status -->
  <g transform="translate(780, 15)">
    <circle cx="6" cy="7" r="3.5" fill="#10B981"/>
    <text x="16" y="11" fill="#94A3B8" class="font-code" font-size="11.5">python 3.12 • utf-8</text>
    <rect x="145" y="-1" width="55" height="18" rx="4" fill="#1E293B"/>
    <text x="153" y="11" fill="#38BDF8" class="font-ui" font-size="10.5" font-weight="700">ACTIVE</text>
  </g>

  <!-- Code Editor Body Area -->
  <g transform="translate(15, 66)">
    <!-- Line Numbers Column -->
    <g class="font-code line-no">
      <text x="35" y="0">01</text>
      <text x="35" y="21">02</text>
      <text x="35" y="42">03</text>
      <text x="35" y="63">04</text>
      <text x="35" y="84">05</text>
      <text x="35" y="105">06</text>
      <text x="35" y="126">07</text>
      <text x="35" y="147">08</text>
      <text x="35" y="168">09</text>
      <text x="35" y="189">10</text>
      <text x="35" y="210">11</text>
      <text x="35" y="231">12</text>
      <text x="35" y="252">13</text>
      <text x="35" y="273">14</text>
      <text x="35" y="294">15</text>
      <text x="35" y="315">16</text>
      <text x="35" y="336">17</text>
      <text x="35" y="357">18</text>
      <text x="35" y="378">19</text>
    </g>

    <!-- Vertical Line Divider -->
    <line x1="48" y1="-12" x2="48" y2="395" stroke="#1E293B" stroke-width="1"/>

    <!-- Code Content -->
    <g class="font-code" transform="translate(60, 0)">
      <!-- Line 01: class LasithaDilshan: -->
      <text y="0">
        <tspan class="kw">class</tspan> <tspan class="cls">LasithaDilshan</tspan><tspan class="op">:</tspan>
      </text>

      <!-- Line 02: docstring -->
      <text y="21">
        <tspan class="doc">"""AI Engineer &amp; Generative AI Architect • 5+ Years Production Systems"""</tspan>
      </text>

      <!-- Line 03: def __init__(self): -->
      <text y="42">
        <tspan dx="16" class="kw">def</tspan> <tspan class="func">__init__</tspan><tspan class="op">(</tspan><tspan class="self">self</tspan><tspan class="op">):</tspan>
      </text>

      <!-- Line 04: name -->
      <text y="63">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">name</tspan> <tspan class="op">=</tspan> <tspan class="str">"Lasitha Dilshan Thilakarathna"</tspan>
      </text>

      <!-- Line 05: location -->
      <text y="84">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">location</tspan> <tspan class="op">=</tspan> <tspan class="str">"Bandaragama, Sri Lanka 🇱🇰"</tspan>
      </text>

      <!-- Line 06: role -->
      <text y="105">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">role</tspan> <tspan class="op">=</tspan> <tspan class="str">"AI Engineer | Generative AI &amp; Agentic Systems Architect"</tspan>
      </text>

      <!-- Line 07: experience -->
      <text y="126">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">experience_years</tspan> <tspan class="op">=</tspan> <tspan class="num">5</tspan>
      </text>

      <!-- Line 08: core_domains -->
      <text y="147">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">core_domains</tspan> <tspan class="op">=</tspan> <tspan class="op">[</tspan>
      </text>

      <!-- Line 09 -->
      <text y="168">
        <tspan dx="56" class="str">"Agentic AI &amp; Autonomous Multi-Agent Workflows"</tspan><tspan class="op">,</tspan>
      </text>

      <!-- Line 10 -->
      <text y="189">
        <tspan dx="56" class="str">"Production Retrieval-Augmented Generation (RAG)"</tspan><tspan class="op">,</tspan>
      </text>

      <!-- Line 11 -->
      <text y="210">
        <tspan dx="56" class="str">"Enterprise Document Intelligence &amp; Semantic Search"</tspan><tspan class="op">,</tspan>
      </text>

      <!-- Line 12 -->
      <text y="231">
        <tspan dx="56" class="str">"LLM Evaluation, Guardrails &amp; Hallucination Mitigation"</tspan><tspan class="op">,</tspan>
      </text>

      <!-- Line 13 -->
      <text y="252">
        <tspan dx="56" class="str">"High-Throughput Asynchronous AI Backends (FastAPI)"</tspan>
      </text>

      <!-- Line 14 -->
      <text y="273">
        <tspan dx="36" class="op">]</tspan>
      </text>

      <!-- Line 15: trophy -->
      <text y="294">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">primary_trophy</tspan> <tspan class="op">=</tspan> <tspan class="str">"🏆 1st Place – Virtusa Agentic AI Hackathon"</tspan>
      </text>

      <!-- Line 16: status -->
      <text y="315">
        <tspan dx="36" class="self">self</tspan><tspan class="op">.</tspan><tspan class="var">status</tspan> <tspan class="op">=</tspan> <tspan class="str">"Open to AI engineering collaborations &amp; impactful roles"</tspan>
      </text>

      <!-- Line 17: def philosophy(self) -> str: -->
      <text y="336">
        <tspan dx="16" class="kw">def</tspan> <tspan class="func">philosophy</tspan><tspan class="op">(</tspan><tspan class="self">self</tspan><tspan class="op">) -&gt; </tspan><tspan class="cls">str</tspan><tspan class="op">:</tspan>
      </text>

      <!-- Line 18: return -->
      <text y="357">
        <tspan dx="36" class="kw">return</tspan> <tspan class="str">"Hardened, production-grade AI systems with deterministic guardrails &amp; ROI."</tspan>
      </text>

      <!-- Line 19: cursor -->
      <text y="378">
        <tspan dx="16" fill="#38BDF8" font-weight="700">▌</tspan>
      </text>
    </g>
  </g>
</svg>
